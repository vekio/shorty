# Air configuration for the Shorty API server.
root = "."
tmp_dir = ".air"

[build]
pre_cmd = ["sqlc generate", "go tool templ generate", "pnpm exec tailwindcss -i internal/web/styles/global.css -o internal/web/static/css/style.css --minify", "cp node_modules/htmx.org/dist/htmx.min.js internal/web/static/js/htmx.min.js"]
cmd = "go build -o ./.air/shorty-api ./cmd/api"
bin = ".air/shorty-api"
entrypoint = ["./.air/shorty-api"]
include_dir = ["cmd/api", "internal"]
include_file = ["go.mod", "go.sum", "package.json", "pnpm-lock.yaml", "config.yml", "sqlc.yml"]
include_ext = ["go", "templ", "css", "js", "json", "sql", "yml", "yaml"]
exclude_dir = [".air", "bin", "vendor", "internal/infra/sqlite/sqlitedb"]
exclude_file = ["internal/web/static/css/style.css"]
exclude_regex = ["_test\\.go", "_templ\\.go"]
exclude_unchanged = true
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
