# Air configuration for the JSON API development process.
root = "."
tmp_dir = ".air/api"

[build]
cmd = "go build -o ./.air/api/shorty-api ./cmd/api"
bin = ".air/api/shorty-api"
entrypoint = ["./.air/api/shorty-api"]
include_dir = [
  "cmd/api",
  "internal/api",
  "internal/app",
  "internal/bootstrap",
  "internal/config",
  "internal/domain",
  "internal/httpmiddleware",
  "internal/infra",
]
include_file = ["go.mod", "go.sum", "config-api.yml"]
include_ext = ["go", "yml", "yaml"]
exclude_dir = [".air", "bin", "vendor"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
