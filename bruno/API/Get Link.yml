info:
  name: Get Link
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/v1/links/:link_code"
  params:
    - name: link_code
      value: "{{link_code}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("gets the created link", function() {
          expect(res.status).to.equal(200);
          expect(res.body.code).to.equal(bru.getVar("link_code"));
          expect(res.body.origin_url).to.be.a("string").and.not.be.empty;
        });

        test("returns the visit count", function() {
          expect(res.body.visits).to.be.a("number").and.at.least(0);
        });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
