info:
  name: Create Link
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/links"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Shorty-Owner
      value: "{{session_id}}"
  body:
    type: json
    data: |-
      {
        "origin_url": "https://example.com/docs"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("link_code", res.body.code);
    - type: tests
      code: |-
        test("creates a link", function() {
          expect(res.status).to.equal(201);
        });

        test("returns the generated code", function() {
          expect(res.body.code).to.be.a("string").and.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
