info:
  name: Get Link
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/links/:link_code"
  params:
    - name: link_code
      value: "{{link_code}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("gets the created link", function() {
          expect(res.status).to.equal(200);
          expect(res.body.code).to.equal(bru.getVar("link_code"));
          expect(res.body.origin_url).to.equal("https://example.com/docs");
        });

        test("returns the visit registered by the redirect", function() {
          expect(res.body.visits).to.equal(1);
        });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
