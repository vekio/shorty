info:
  name: Delete Link
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{base_url}}/links/:link_code"
  params:
    - name: link_code
      value: "{{link_code}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("deletes the link without a response body", function() {
          expect(res.status).to.equal(204);
          expect(res.body == null || res.body === "").to.equal(true);
        });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
