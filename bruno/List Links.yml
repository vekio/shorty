info:
  name: List Links
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/links"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("lists the created link", function() {
          expect(res.status).to.equal(200);
          expect(res.body.links).to.be.an("array");
          expect(res.body.links.some(link => link.code === bru.getVar("link_code"))).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
