info:
  name: Open Dashboard
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/_/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("serves the administration dashboard", function() {
          expect(res.status).to.equal(200);
          expect(res.getHeader("content-type")).to.include("text/html");
          expect(res.body).to.include("Shorty");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
