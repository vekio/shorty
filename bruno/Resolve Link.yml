info:
  name: Resolve Link
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/links/:link_code/resolve"
  params:
    - name: link_code
      value: "{{link_code}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("resolves the origin URL and registers a visit", function() {
          expect(res.status).to.equal(200);
          expect(res.body.origin_url).to.equal("https://example.com/docs");
        });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
