info:
  name: Resolve Link
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/:link_code"
  params:
    - name: link_code
      value: "{{link_code}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("redirects to the origin URL", function() {
          expect(res.status).to.equal(302);
          expect(res.getHeader("location")).to.equal("https://example.com/docs");
        });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
