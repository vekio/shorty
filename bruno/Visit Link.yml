info:
  name: Visit Link
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/links/:link_code/visit"
  params:
    - name: link_code
      value: "{{link_code}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("registers the visit without a response body", function() {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
