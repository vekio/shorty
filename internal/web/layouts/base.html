{{define "layout" -}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
    ></script>
    <script defer src="/assets/js/app.js"></script>
  </head>
  <body>
    <main class="mx-auto w-[calc(100%-2rem)] max-w-280 py-20 max-[42rem]:py-12">
      {{if .NotFound}} {{template "not-found" .NotFound}} {{else}}
      <header class="mb-12 max-w-3xl">
        <p
          class="mb-2.5 text-xs font-extrabold tracking-[.14em] text-accent-dark uppercase"
        >
          A small URL shortener
        </p>
        <h1
          class="mb-4 text-[clamp(3rem,8vw,6.5rem)] font-bold leading-[.89] tracking-[-.065em]"
        >
          Short links,<br /><span class="text-accent">without the noise.</span>
        </h1>
        <p class="max-w-xl text-lg leading-relaxed text-muted">
          Create, inspect and follow your links from one tiny Go binary.
        </p>
      </header>

      {{template "home" .}} {{end}}
    </main>
  </body>
</html>
{{- end}}
